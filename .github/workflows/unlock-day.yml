name: Auto-Unlock Daily Content

on:
  schedule:
    - cron: '30 14 * * *'   # 8:00 PM IST (UTC+5:30) = 14:30 UTC
  workflow_dispatch:          # manual trigger for testing / catch-up

permissions:
  contents: write

jobs:
  unlock-day:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Zero-To-Hero-WLAN-Automation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unlock script
        id: unlock
        run: python3 scripts/unlock_next_day.py

      - name: Commit and push if a day was unlocked
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/curriculum.js
          if git diff --staged --quiet; then
            echo "Nothing to commit — all days already unlocked or HTML not ready."
          else
            DAY=$(grep -oP 'UNLOCKED_DAY=\K\d+' /tmp/unlock_result.txt || echo '?')
            git commit -m "chore: auto-unlock Day ${DAY} content [skip ci]"
            git push
            echo "Day ${DAY} is now live on GitHub Pages."
          fi
